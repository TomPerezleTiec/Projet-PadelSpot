[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "{{ project_name }} generated from a Kedro + DVC + Docker/Spark template."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "{{ author_name }}"}]
dependencies = [
  "kedro>=0.19.10,<0.20",
  "kedro-datasets[pandas]>=4.1.0,<5",
  "dvc>=3.58,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "{{ python_package }}"
project_name = "{{ project_name }}"
kedro_init_version = "0.19.10"
source_dir = "src"
